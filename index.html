<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Malkuth Control Hub v3.1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#f1dfaa;font-family:Arial,sans-serif;min-height:100%;overflow:hidden}
.stage{position:relative;isolation:isolate;min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:#000}
.stage::before{content:"";position:absolute;z-index:0;inset:-32px;background:url("malkuth-v3.1-visual-master.png") center/cover no-repeat;filter:blur(22px) brightness(.38);transform:scale(1.08)}
.stage::after{content:"";position:absolute;z-index:0;inset:0;background:rgba(0,0,0,.18)}
.dashboard{position:relative;z-index:1;width:min(100vw,calc(100dvh * 1.0942452),1280px);line-height:0}
.dashboard img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mobile-tray{display:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:14px}
.hotspot:active{background:rgba(225,185,83,.14);box-shadow:0 0 0 1px rgba(225,185,83,.45)}
.create{left:44.2%;top:29.9%;width:18.5%;height:4.0%}
.retrieve{left:44.2%;top:34.1%;width:18.5%;height:4.0%}
.act{left:44.2%;top:38.3%;width:18.5%;height:4.0%}
.verify{left:44.2%;top:42.5%;width:18.5%;height:4.0%}
.explore{left:44.2%;top:46.7%;width:18.5%;height:4.0%}
.intent{left:44.0%;top:23.7%;width:19%;height:5.3%}
.modal{position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.84),rgba(0,0,0,.92)),url("malkuth-tarot-control-overlay.png") center/cover no-repeat;display:none;place-items:center;padding:18px;z-index:20;line-height:1.45;background-blend-mode:normal,luminosity}
.modal.open{display:grid}
.card{position:relative;width:min(640px,100%);overflow:hidden;background:linear-gradient(145deg,rgba(20,16,8,.92),rgba(2,3,3,.97)),url("malkuth-tarot-control-overlay.png") left center/auto 100% no-repeat;border:2px solid #b98a38;border-radius:6px;padding:22px;box-shadow:0 24px 80px #000,inset 0 0 28px rgba(184,132,42,.12);background-blend-mode:normal,luminosity}
.card::before{content:"◆";position:absolute;top:6px;left:9px;color:#b98a38;font-size:11px}
.card::after{content:"◆";position:absolute;right:9px;bottom:6px;color:#b98a38;font-size:11px}
.eyebrow{font-size:10px;letter-spacing:.3em;color:#9f8248}
h1{font:400 30px Georgia,serif;letter-spacing:.04em;margin:8px 0 6px;color:#ead79d}
p{color:#aaa393;font-size:13px}
textarea{width:100%;min-height:120px;background:linear-gradient(rgba(1,2,2,.9),rgba(1,2,2,.94)),url("malkuth-tarot-control-overlay.png") 48% center/420% auto no-repeat;color:#f5ebcf;border:1px solid #b28637;border-radius:5px;padding:14px;font:15px Arial;resize:vertical;background-blend-mode:normal,luminosity;box-shadow:inset 3px 0 #b88938}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button.action{padding:13px;border-radius:5px;border:1px solid #a27b33;background:linear-gradient(rgba(4,5,4,.78),rgba(4,5,4,.9)),url("malkuth-tarot-control-overlay.png") 68% center/360% auto no-repeat;color:#ead79d;font-weight:700;text-shadow:0 1px 3px #000;background-blend-mode:normal,luminosity;box-shadow:inset 3px 0 #b88938}
button.primary{background-image:linear-gradient(rgba(31,21,7,.72),rgba(5,5,3,.88)),url("malkuth-tarot-control-overlay.png");background-position:center,46% center;background-size:cover,360% auto;color:#f6e3aa}
.status{margin-top:13px;padding-top:12px;border-top:1px solid #3f3520;color:#8f897d;font-size:11px;letter-spacing:.06em}
@media(max-width:700px){
 html,body{overflow:auto}
 .stage{min-height:100dvh;display:block;background:#050606}
 .stage::before,.stage::after{display:none}
 .dashboard{width:100vw}
 .intent{left:42%;width:22%}
 .create,.retrieve,.act,.verify,.explore{left:42%;width:22%}
 .mobile-tray{position:relative;display:block;width:100%;overflow:hidden;background:#030303;border-top:2px solid #b78b39;line-height:1.25;box-shadow:inset 0 12px 28px rgba(0,0,0,.72)}
 .mobile-intent{display:block;width:calc(100% - 24px);min-height:58px;margin:14px 12px 10px;border:0;border-bottom:1px solid #8f682b;background:transparent;color:#f3dda0;font:700 17px Georgia,serif;letter-spacing:.06em;text-shadow:0 1px 4px #000}
 .sacred-flow{position:relative;width:100%;aspect-ratio:2/3;background:url("malkuth-sacred-flow-controls.png") center/100% 100% no-repeat}
 .mobile-actions{position:absolute;inset:0}
 .mobile-action{position:absolute;left:31%;width:62%;height:13%;padding:0 7% 0 8%;border:0;background:transparent;color:#f6e4ac;text-align:center;font:700 clamp(17px,5.4vw,27px) Georgia,serif;letter-spacing:.09em;text-shadow:0 2px 5px #000,0 0 12px rgba(225,169,62,.3)}
 .mobile-action:nth-child(1){top:5%}
 .mobile-action:nth-child(2){top:24%}
 .mobile-action:nth-child(3){top:43%}
 .mobile-action:nth-child(4){top:62%}
 .mobile-action:nth-child(5){top:81%}
 .mobile-action:active,.mobile-intent:active{color:#fff1bd;filter:brightness(1.28);text-shadow:0 0 12px #e0aa45}
 .mobile-action small{display:block;margin-top:4px;color:#cdbb8c;font:400 clamp(9px,2.8vw,13px) Georgia,serif;letter-spacing:.04em;text-shadow:0 1px 3px #000}
 .mobile-flow{padding:10px 8px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(156,116,44,.35);text-align:center;color:#b98b3d;font-size:9px;letter-spacing:.11em;background:#030303}
}
</style>
</head>
<body>
<div class="stage">
 <main class="dashboard" aria-label="Malkuth Control Hub">
  <img src="malkuth-v3.1-visual-master.png" alt="Malkuth Control Hub v3.1 visual master">
  <button class="hotspot intent" aria-label="State an intention" onclick="openIntent('Intention')"></button>
  <button class="hotspot create" aria-label="Create" onclick="openIntent('Create')"></button>
  <button class="hotspot retrieve" aria-label="Retrieve" onclick="openIntent('Retrieve')"></button>
  <button class="hotspot act" aria-label="Act" onclick="openIntent('Act')"></button>
  <button class="hotspot verify" aria-label="Verify" onclick="openIntent('Verify')"></button>
  <button class="hotspot explore" aria-label="Explore" onclick="openIntent('Explore')"></button>
 </main>
 <nav class="mobile-tray" aria-label="Malkuth mobile controls">
  <button class="mobile-intent" onclick="openIntent('Intention')">WHAT DO YOU WANT TO HAPPEN?</button>
  <div class="sacred-flow">
   <div class="mobile-actions">
    <button class="mobile-action" onclick="openIntent('Create')">CREATE<small>Direct capability</small></button>
    <button class="mobile-action" onclick="openIntent('Retrieve')">RETRIEVE<small>Reveal and understand</small></button>
    <button class="mobile-action" onclick="openIntent('Act')">ACT<small>Cross the threshold</small></button>
    <button class="mobile-action" onclick="openIntent('Verify')">VERIFY<small>Give action structure</small></button>
    <button class="mobile-action" onclick="openIntent('Explore')">EXPLORE<small>Open the next horizon</small></button>
   </div>
  </div>
  <div class="mobile-flow">INTENTION → ACTION → RESULT → VERIFIED</div>
 </nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeIntent()">
 <section class="card">
  <div class="eyebrow">INTENTION INTO REALITY</div>
  <h1 id="mode">WHAT DO YOU WANT TO HAPPEN?</h1>
  <p>State the outcome once. Malkuth resolves the route beneath the visual interface.</p>
  <textarea id="intentText" placeholder="Tell Malkuth what you want to happen."></textarea>
  <div class="row">
   <button class="action primary" onclick="execute()">EXECUTE THROUGH CHATGPT</button>
   <button class="action" onclick="closeIntent()">RETURN TO HUB</button>
  </div>
  <div class="status">INTENTION → RESOLVE → MANDATE → EXECUTE → VERIFY → LEARN</div>
 </section>
</div>

<script>
function openIntent(mode){
 document.getElementById('modal').classList.add('open');
 document.getElementById('mode').textContent = mode==='Intention' ? 'WHAT DO YOU WANT TO HAPPEN?' : mode.toUpperCase();
 setTimeout(()=>document.getElementById('intentText').focus(),100);
}
function closeIntent(){document.getElementById('modal').classList.remove('open')}
function execute(){
 const t=document.getElementById('intentText').value.trim();
 if(!t){document.getElementById('intentText').focus();return}
 const protocol=`MALKUTH v3.1 ORCHESTRATION\n\nINTENTION: ${t}\n\nResolve the smallest capability needed. Apply the mandate layer. Execute any useful authorised external action available. Ask only at a genuine boundary. Return evidence and verification. Preserve what is learned.`;
 navigator.clipboard?.writeText(protocol).catch(()=>{});
 window.open('https://chatgpt.com/','_blank');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeIntent()})
</script>
</body>
</html>
