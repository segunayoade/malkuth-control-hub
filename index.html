<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Malkuth Control Hub v3.1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#f1dfaa;font-family:Arial,sans-serif;min-height:100%;overflow:hidden}
.stage{position:relative;isolation:isolate;min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:#000}
.stage::before{content:"";position:absolute;z-index:0;inset:-32px;background:url("malkuth-v3.1-visual-master.png") center/cover no-repeat;filter:blur(22px) brightness(.38);transform:scale(1.08)}
.stage::after{content:"";position:absolute;z-index:0;inset:0;background:rgba(0,0,0,.18)}
.dashboard{position:relative;z-index:1;width:min(100vw,calc(100dvh * 1.0942452),1280px);line-height:0}
.dashboard img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mobile-tray{display:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:14px}
.hotspot:active{background:rgba(225,185,83,.14);box-shadow:0 0 0 1px rgba(225,185,83,.45)}
.create{left:44.2%;top:29.9%;width:18.5%;height:4.0%}
.retrieve{left:44.2%;top:34.1%;width:18.5%;height:4.0%}
.act{left:44.2%;top:38.3%;width:18.5%;height:4.0%}
.verify{left:44.2%;top:42.5%;width:18.5%;height:4.0%}
.explore{left:44.2%;top:46.7%;width:18.5%;height:4.0%}
.intent{left:44.0%;top:23.7%;width:19%;height:5.3%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;place-items:center;padding:18px;z-index:20;line-height:1.45}
.modal.open{display:grid}
.card{width:min(640px,100%);background:linear-gradient(145deg,#11120f,#050606);border:1px solid #9d7934;border-radius:20px;padding:22px;box-shadow:0 24px 80px #000}
.eyebrow{font-size:10px;letter-spacing:.3em;color:#9f8248}
h1{font:400 30px Georgia,serif;letter-spacing:.04em;margin:8px 0 6px;color:#ead79d}
p{color:#aaa393;font-size:13px}
textarea{width:100%;min-height:120px;background:#050606;color:#f5ebcf;border:1px solid #6e572a;border-radius:13px;padding:14px;font:15px Arial;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button.action{padding:13px;border-radius:12px;border:1px solid #8f7138;background:#15140f;color:#ead79d;font-weight:700}
button.primary{background:linear-gradient(135deg,#8d6a2a,#d1ad54);color:#0b0b09}
.status{margin-top:13px;padding-top:12px;border-top:1px solid #3f3520;color:#8f897d;font-size:11px;letter-spacing:.06em}
@media(max-width:700px){
 html,body{overflow:auto}
 .stage{min-height:100dvh;display:block;background:#050606}
 .stage::before,.stage::after{display:none}
 .dashboard{width:100vw}
 .intent{left:42%;width:22%}
 .create,.retrieve,.act,.verify,.explore{left:42%;width:22%}
 .mobile-tray{position:relative;display:block;width:100%;padding:18px max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden;background:linear-gradient(rgba(2,4,4,.64),rgba(2,4,4,.78)),radial-gradient(circle at 50% 0,rgba(24,107,174,.22),transparent 30%),url("malkuth-tarot-control-overlay.png") left center/cover no-repeat,#050606;border-top:2px solid #b78b39;line-height:1.25;box-shadow:inset 0 12px 28px rgba(0,0,0,.72)}
 .mobile-tray::before{content:"◆  MALKUTH  ◆";display:block;margin:-5px auto 11px;text-align:center;color:#c89b48;font:12px Georgia,serif;letter-spacing:.28em;text-shadow:0 0 12px rgba(218,163,67,.45)}
 .mobile-tray::after{content:"";position:absolute;pointer-events:none;inset:8px;border:1px solid rgba(166,122,47,.28);clip-path:polygon(0 0,32% 0,35% 1px,65% 1px,68% 0,100% 0,100% 100%,0 100%)}
 .mobile-intent{position:relative;z-index:1;width:100%;min-height:50px;border:1px solid #c99b47;border-radius:5px;background:linear-gradient(135deg,rgba(63,45,18,.7),rgba(8,12,13,.94));color:#f1dfaa;font-family:Georgia,serif;font-weight:700;letter-spacing:.06em;box-shadow:inset 0 0 18px rgba(196,144,52,.08),0 0 16px rgba(21,112,180,.08)}
 .mobile-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
 .mobile-action{position:relative;z-index:1;min-height:55px;padding:9px 10px 9px 14px;border:1px solid #8b692e;border-radius:4px;background-image:linear-gradient(100deg,rgba(3,5,5,.96) 0%,rgba(4,8,10,.78) 55%,rgba(3,5,5,.9) 100%),url("malkuth-tarot-control-overlay.png");background-size:cover,520% auto;background-repeat:no-repeat;color:#f4dfa3;text-align:left;font-family:Georgia,serif;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 4px #000;box-shadow:inset 3px 0 #c0923e,inset 0 0 15px rgba(16,107,166,.12)}
 .mobile-action:nth-child(1){background-position:center,34% center}
 .mobile-action:nth-child(2){background-position:center,10% center}
 .mobile-action:nth-child(3){background-position:center,48% center}
 .mobile-action:nth-child(4){background-position:center,60% center}
 .mobile-action:nth-child(5){background-position:center,88% center}
 .mobile-action:active,.mobile-intent:active{border-color:#e4b95f;filter:brightness(1.22);box-shadow:inset 3px 0 #e8bd61,0 0 14px rgba(37,147,218,.3)}
 .mobile-action small{display:block;margin-top:2px;color:#c8b98e;font-size:10px;font-weight:400;text-shadow:0 1px 3px #000}
 .mobile-action:last-child{grid-column:1/-1}
 .mobile-flow{position:relative;z-index:1;margin-top:12px;padding-top:9px;border-top:1px solid rgba(156,116,44,.35);text-align:center;color:#b98b3d;font-size:9px;letter-spacing:.11em}
}
</style>
</head>
<body>
<div class="stage">
 <main class="dashboard" aria-label="Malkuth Control Hub">
  <img src="malkuth-v3.1-visual-master.png" alt="Malkuth Control Hub v3.1 visual master">
  <button class="hotspot intent" aria-label="State an intention" onclick="openIntent('Intention')"></button>
  <button class="hotspot create" aria-label="Create" onclick="openIntent('Create')"></button>
  <button class="hotspot retrieve" aria-label="Retrieve" onclick="openIntent('Retrieve')"></button>
  <button class="hotspot act" aria-label="Act" onclick="openIntent('Act')"></button>
  <button class="hotspot verify" aria-label="Verify" onclick="openIntent('Verify')"></button>
  <button class="hotspot explore" aria-label="Explore" onclick="openIntent('Explore')"></button>
 </main>
 <nav class="mobile-tray" aria-label="Malkuth mobile controls">
  <button class="mobile-intent" onclick="openIntent('Intention')">WHAT DO YOU WANT TO HAPPEN?</button>
  <div class="mobile-actions">
   <button class="mobile-action" onclick="openIntent('Create')">CREATE<small>Make an intention</small></button>
   <button class="mobile-action" onclick="openIntent('Retrieve')">RETRIEVE<small>Access and review</small></button>
   <button class="mobile-action" onclick="openIntent('Act')">ACT<small>Execute and automate</small></button>
   <button class="mobile-action" onclick="openIntent('Verify')">VERIFY<small>Confirm and record</small></button>
   <button class="mobile-action" onclick="openIntent('Explore')">EXPLORE<small>Learn and expand</small></button>
  </div>
  <div class="mobile-flow">INTENTION → ACTION → RESULT → VERIFIED</div>
 </nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeIntent()">
 <section class="card">
  <div class="eyebrow">INTENTION INTO REALITY</div>
  <h1 id="mode">WHAT DO YOU WANT TO HAPPEN?</h1>
  <p>State the outcome once. Malkuth resolves the route beneath the visual interface.</p>
  <textarea id="intentText" placeholder="Tell Malkuth what you want to happen."></textarea>
  <div class="row">
   <button class="action primary" onclick="execute()">EXECUTE THROUGH CHATGPT</button>
   <button class="action" onclick="closeIntent()">RETURN TO HUB</button>
  </div>
  <div class="status">INTENTION → RESOLVE → MANDATE → EXECUTE → VERIFY → LEARN</div>
 </section>
</div>

<script>
function openIntent(mode){
 document.getElementById('modal').classList.add('open');
 document.getElementById('mode').textContent = mode==='Intention' ? 'WHAT DO YOU WANT TO HAPPEN?' : mode.toUpperCase();
 setTimeout(()=>document.getElementById('intentText').focus(),100);
}
function closeIntent(){document.getElementById('modal').classList.remove('open')}
function execute(){
 const t=document.getElementById('intentText').value.trim();
 if(!t){document.getElementById('intentText').focus();return}
 const protocol=`MALKUTH v3.1 ORCHESTRATION\n\nINTENTION: ${t}\n\nResolve the smallest capability needed. Apply the mandate layer. Execute any useful authorised external action available. Ask only at a genuine boundary. Return evidence and verification. Preserve what is learned.`;
 navigator.clipboard?.writeText(protocol).catch(()=>{});
 window.open('https://chatgpt.com/','_blank');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeIntent()})
</script>
</body>
</html>
